<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>EMO Cover Screen AI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 100vw;
      height: 100vh;
      background-color: #000000;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #status {
      position: absolute;
      top: 10px;
      color: #00f3ff;
      font-family: monospace;
      font-size: 11px;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <div id="status">Tap eyes to speak</div>
  <canvas id="eyeCanvas"></canvas>

  <script>
    const canvas = document.getElementById('eyeCanvas');
    const ctx = canvas.getContext('2d');
    const statusDiv = document.getElementById('status');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

// Automatically reads the API key from your web address URL
const urlParams = new URLSearchParams(window.location.search);
const GEMINI_API_KEY = urlParams.get('key') || "PASTE_KEY_HERE";
const GEMINI_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:streamGenerateContent?key=${GEMINI_API_KEY}`;

    let state = 'idle';
    let capturedTranscript = "";

    const eyeConfig = {
      color: '#00f3ff',
      size: 55,
      spacing: 110,
      eyeYOffset: 0,
      scaleY: 1.0,
      scaleX: 1.0,
      rotation: 0
    };

    let blinkTimer = 1;
    let isBlinking = false;
    let pulseAngle = 1;

    // --- Speech Recognition setup ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true; // Capture live speech chunks
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        state = 'listening';
        capturedTranscript = "";
        statusDiv.innerText = "Listening...";
      };

      recognition.onresult = (event) => {
        let transcript = "";
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          transcript += event.results[i][0].transcript;
        }
        capturedTranscript = transcript;
        statusDiv.innerText = `Hear: "${transcript}"`;
      };

      recognition.onerror = (event) => {
        console.error("Speech Rec Error:", event.error);
        statusDiv.innerText = `Mic Error: ${event.error}`;
        state = 'idle';
      };

      recognition.onend = async () => {
        if (capturedTranscript.trim().length > 0) {
          state = 'thinking';
          statusDiv.innerText = "Thinking...";
          await askGemini(capturedTranscript);
        } else {
          state = 'idle';
          statusDiv.innerText = "No speech detected. Tap to retry.";
        }
      };
    } else {
      statusDiv.innerText = "Speech API not supported in this WebView.";
    }

    // --- Gemini Call ---
    async function askGemini(promptText) {
      try {
        const response = await fetch(GEMINI_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }],
            systemInstruction: {
              parts: [{ text: "You are EMO, a friendly robot living on a phone's cover screen. Keep responses after a shot silent." }]
            }
          })
        });

        const data = await response.json();
        
        if (data.error) {
          statusDiv.innerText = `API Key Error: ${data.error.message}`;
          speakResponse("API key error.");
          return;
        }

        const replyText = data.candidates?.[0]?.content?.parts?.[0]?.text || "I didn't catch that.";
        statusDiv.innerText = replyText;
        speakResponse(replyText);
      } catch (err) {
        console.error("API Error:", err);
        statusDiv.innerText = "Network Error";
        speakResponse("Network error.");
      }
    }

    // --- Text to Speech ---
// Add explicitly defined language and voice engine initialization
function speakResponse(text) {
  if (!('speechSynthesis' in window)) {
    state = 'idle';
    return;
  }

  // Mandatory for Android WebView: clear pending audio queues
  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'en-US';
  utterance.rate = 1.0;
  utterance.pitch = 1.0;

  // Wait for Android native voices to populate
  const voices = window.speechSynthesis.getVoices();
  if (voices.length > 0) {
    // Prefer Google US English voice if available on Android
    const preferredVoice = voices.find(v => v.lang.includes('en') && v.name.includes('Google'));
    if (preferredVoice) utterance.voice = preferredVoice;
  }

  utterance.onstart = () => { 
    state = 'speaking'; 
  };
  
  utterance.onend = () => { 
    state = 'idle'; 
    statusDiv.innerText = "Tap eyes to speak";
  };
  
  utterance.onerror = (e) => { 
    console.error("SpeechSynthesis Error:", e);
    state = 'idle'; 
    statusDiv.innerText = "Tap eyes to speak";
  };

  // Small timeout fix for Android Chrome TTS bug
  setTimeout(() => {
    window.speechSynthesis.speak(utterance);
  }, 50);
}

    // Touch event listener
    window.addEventListener('click', () => {
      if (state === 'speaking') {
        window.speechSynthesis.cancel();
        state = 'idle';
        statusDiv.innerText = "Tap eyes to speak";
        return;
      }

      if (recognition && state === 'idle') {
        try {
          recognition.start();
        } catch (e) {
          statusDiv.innerText = "Mic busy, try tapping again.";
        }
      }
    });

    // --- Render Loop ---
    function update() {
      pulseAngle += 0.05;

      eyeConfig.scaleX = 1.0;
      eyeConfig.scaleY = 1.0;
      eyeConfig.rotation = 0;
      eyeConfig.eyeYOffset = 0;

      blinkTimer++;
      if (blinkTimer > 180 && !isBlinking) {
        if (Math.random() < 0.05) isBlinking = true;
      }

      if (isBlinking) {
        eyeConfig.scaleY = 0.05;
        if (blinkTimer % 5 === 0) {
          isBlinking = false;
          blinkTimer = 0;
        }
      }

      if (state === 'idle') {
        eyeConfig.color = '#00f3ff';
        eyeConfig.scaleY *= 1 + Math.sin(pulseAngle) * 0.03;
      } 
      else if (state === 'listening') {
        eyeConfig.color = '#00ff66';
        eyeConfig.scaleX = 1.25;
        eyeConfig.scaleY = 1.25;
      } 
      else if (state === 'thinking') {
        eyeConfig.color = '#ffaa00';
        eyeConfig.rotation = Math.sin(pulseAngle * 2) * 0.15;
        eyeConfig.scaleX = 0.85;
        eyeConfig.scaleY = 0.85;
      } 
      else if (state === 'speaking') {
        eyeConfig.color = '#00f3ff';
        eyeConfig.scaleY = 1 + Math.abs(Math.sin(pulseAngle * 4)) * 0.45;
        eyeConfig.scaleX = 1 - Math.abs(Math.sin(pulseAngle * 4)) * 0.12;
      }
    }

    function drawEye(cx, cy, side) {
      ctx.save();
      ctx.translate(cx, cy + eyeConfig.eyeYOffset);
      ctx.rotate(side * eyeConfig.rotation);
      ctx.scale(eyeConfig.scaleX, eyeConfig.scaleY);

      ctx.shadowColor = eyeConfig.color;
      ctx.shadowBlur = 20;

      ctx.fillStyle = eyeConfig.color;
      const size = eyeConfig.size;
      const radius = 18;

      ctx.beginPath();
      ctx.roundRect(-size / 2, -size / 2, size, size, radius);
      ctx.fill();

      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const spacing = eyeConfig.spacing / 2;

      drawEye(centerX - spacing, centerY, -1);
      drawEye(centerX + spacing, centerY, 1);
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
